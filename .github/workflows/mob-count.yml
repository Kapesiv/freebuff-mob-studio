name: Päivitä mobi-määrä-badge

on:
  push:
    branches: [main]
    paths:
      - 'js/mobs/**'
      - 'tools/mob-count.mjs'
  workflow_dispatch:

jobs:
  update-badge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Laske mobien määrä
        run: node tools/mob-count.mjs

      - name: Commit badge update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add badges/mobs.json
          if git diff --cached --quiet; then
            echo "Määrä ei muuttunut — ei commitia."
          else
            git commit -m "Päivitä mobi-määrä-badge: $(node -p "require('./badges/mobs.json').message") mobia"
            git push
          fi
